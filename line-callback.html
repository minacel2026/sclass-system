<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINEログイン処理中… | Sclass</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0e0e0e;color:#e9e2c9;font-family:'Noto Sans JP',sans-serif;text-align:center;padding:1.2rem}
  .box{max-width:420px}
  .spin{width:38px;height:38px;border:3px solid rgba(201,168,76,.25);border-top-color:#c9a84c;
        border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 1rem}
  @keyframes sp{to{transform:rotate(360deg)}}
  h1{font-size:1.05rem;font-weight:700;margin:.3rem 0}
  p{font-size:.85rem;color:#b8ad86;line-height:1.6}
  .err{color:#e6a3a3}
  .uid{user-select:all;background:#1a1a1a;border:1px solid #333;border-radius:6px;
       padding:.5rem;font-size:.72rem;word-break:break-all;margin:.6rem 0;color:#e9e2c9}
  a.btn{display:inline-block;margin-top:.8rem;background:#c9a84c;color:#1a1200;text-decoration:none;
        padding:.55rem 1.2rem;border-radius:6px;font-weight:700;font-size:.82rem}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="spin"></div>
  <h1>LINEログインを処理しています…</h1>
  <p>そのままお待ちください。</p>
</div>

<script>
const GAS_URL = (function(){var U='https://script.google.com/macros/s/AKfycbwLHdGQrxsQzNK-hfRa7Gu_9t4Qz8IseeMHUTVeobiYuWRJ8Lpfku98vYYnN3TNx-4b/exec';try{if(localStorage.getItem('gasUrl')!==U)localStorage.setItem('gasUrl',U);}catch(e){}return U;})();

function show(html){ document.getElementById('box').innerHTML = html; }

(async function(){
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const errParam = params.get('error');

  if (errParam || !code){
    show('<h1 class="err">ログインをキャンセルしました</h1>'
       + '<p>もう一度お試しください。</p>'
       + '<a class="btn" href="login.html">ログイン画面へ</a>');
    return;
  }

  try{
    // 認証コードをGASへ渡し、セッショントークンを受け取る
    const r = await fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'lineExchange', code: code }) });
    const d = await r.json();

    if (d && d.ok && d.token){
      sessionStorage.setItem('lmb_token', d.token);
      sessionStorage.setItem('lmb_current_user', JSON.stringify(d.user));
      location.replace('portal.html');
      return;
    }

    if (d && d.error === 'not_registered'){
      show('<h1 class="err">未登録のLINEアカウントです</h1>'
         + '<p>このLINEアカウントは、まだスタッフとして登録されていません。<br>'
         + '管理者に下記のUIDを伝えて、登録を依頼してください。</p>'
         + '<div class="uid">' + (d.uid || '') + '</div>'
         + '<p>' + (d.name ? '（表示名：' + d.name + '）' : '') + '</p>'
         + '<a class="btn" href="login.html">戻る</a>');
      return;
    }

    if (d && d.error === 'inactive'){
      show('<h1 class="err">このアカウントは無効です</h1><p>管理者にお問い合わせください。</p><a class="btn" href="login.html">戻る</a>');
      return;
    }

    if (d && d.error === 'no_secret'){
      show('<h1 class="err">サーバ設定が未完了です</h1><p>管理者へ：GASのチャネルシークレットが未設定です。</p><a class="btn" href="login.html">戻る</a>');
      return;
    }

    show('<h1 class="err">ログインに失敗しました</h1>'
       + '<p>時間をおいて、もう一度お試しください。</p>'
       + '<a class="btn" href="login.html">ログイン画面へ</a>');
  }catch(e){
    show('<h1 class="err">通信エラー</h1>'
       + '<p>ネットワークをご確認のうえ、もう一度お試しください。</p>'
       + '<a class="btn" href="login.html">ログイン画面へ</a>');
  }
})();
</script>
</body>
</html>
