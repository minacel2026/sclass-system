<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ログイン | Sclassランボルギーニ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Bebas+Neue&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mobile.css">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C9A84C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sclass">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<style>
:root{
  --gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#7A5C14;
  --bk:#080808;--d1:#0E0E0E;--d2:#161616;--d3:#1E1E1E;
  --wh:#F0EBE0;--wh2:rgba(240,235,224,0.6);--wh3:rgba(240,235,224,0.25);
  --red:#E05252;--grn:#52B788;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at center,#1a1608 0%,var(--bk) 60%);color:var(--wh);font-family:'Noto Sans JP',sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}

.login-box{width:100%;max-width:400px;background:var(--d2);border:1px solid rgba(201,168,76,.25);padding:2.5rem 2rem;position:relative;overflow:hidden}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.logo-area{text-align:center;margin-bottom:2rem}
.logo-mark{width:56px;height:56px;border:1.5px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.7rem;color:var(--gold);transform:rotate(45deg);margin-bottom:1rem}
.logo-mark span{transform:rotate(-45deg)}
.title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.15em;color:var(--gold-l)}
.sub{font-size:.68rem;letter-spacing:.25em;color:var(--wh2);margin-top:.3rem}

.sep{height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.3),transparent);margin:1.5rem 0}

.field{margin-bottom:.9rem}
.field label{display:block;font-size:.68rem;letter-spacing:.1em;color:var(--wh2);margin-bottom:.35rem}
.input{width:100%;background:var(--d3);border:1px solid rgba(201,168,76,.2);color:var(--wh);padding:.6rem .8rem;font-family:'Noto Sans JP',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--gold)}

.btn-login{width:100%;background:var(--gold);border:none;color:var(--bk);padding:.7rem;font-family:'Noto Sans JP',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;letter-spacing:.08em;transition:all .2s;margin-top:.5rem}
.btn-login:hover{background:var(--gold-l)}
.btn-login:disabled{opacity:.5;cursor:not-allowed}

.err-msg{font-size:.78rem;color:var(--red);text-align:center;margin-top:.8rem;min-height:1em}
.info-msg{font-size:.7rem;color:var(--wh2);text-align:center;margin-top:1rem;line-height:1.6}
.info-msg strong{color:var(--gold-l)}

.dev-hint{background:rgba(82,153,224,.08);border:1px solid rgba(82,153,224,.2);padding:.7rem;margin-top:1rem;font-size:.68rem;color:var(--wh2);line-height:1.6}
.dev-hint strong{color:#8BB8E8}
.dev-hint code{background:var(--d1);padding:.1rem .3rem;font-family:monospace;font-size:.65rem;color:var(--gold-l)}
</style>
<!-- ═══ スプレッドシート同期インジケータ（全画面共通） ═══ -->
<script>
(function(){
  if (window.__lmbSyncInstalled) return;
  window.__lmbSyncInstalled = true;
  try{
    var st=document.createElement('style');
    st.textContent='@keyframes lmbSyncSpin{to{transform:rotate(360deg)}}'
      +'#lmb-sync-badge{position:fixed;top:14px;left:50%;transform:translate(-50%,-14px);z-index:2147483646;'
      +'display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:30px;background:rgba(22,19,14,.94);'
      +'border:1px solid rgba(201,168,76,.55);color:#ecdfba;font-size:.78rem;font-weight:600;'
      +'font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;letter-spacing:.02em;'
      +'box-shadow:0 8px 28px rgba(0,0,0,.45);opacity:0;pointer-events:none;white-space:nowrap;'
      +'transition:opacity .25s ease,transform .25s ease}'
      +'#lmb-sync-badge.show{opacity:1;transform:translate(-50%,0)}'
      +'#lmb-sync-badge .lmb-si{width:14px;height:14px;flex:0 0 auto;border:2px solid rgba(201,168,76,.3);'
      +'border-top-color:#c9a84c;border-radius:50%;animation:lmbSyncSpin .7s linear infinite}';
    (document.head||document.documentElement).appendChild(st);
  }catch(e){}
  function el(){
    var e=document.getElementById('lmb-sync-badge');
    if(!e){ e=document.createElement('div'); e.id='lmb-sync-badge';
      e.innerHTML='<span class="lmb-si"></span><span>通信中…</span>';
      (document.body||document.documentElement).appendChild(e); }
    return e;
  }
  var n=0, t=null, dly=null;
  var LMB_SHOW_DELAY=600;   /* これより速い通信ではバッジを出さない（チラつき防止） */
  var LMB_SILENT=/[?&]action=(getNewOrders|getPendingUids|getRegistrations|getStockRev)\b/;  /* 裏の自動チェックは黙って実行 */
  function show(){ if(t){clearTimeout(t);t=null;} try{el().classList.add('show');}catch(e){} }
  function hide(){ var e=document.getElementById('lmb-sync-badge'); if(e) e.classList.remove('show'); }
  window.__lmbSyncStart=function(){ n++; if(dly===null){ dly=setTimeout(function(){ dly=null; if(n>0) show(); }, LMB_SHOW_DELAY); } };
  window.__lmbSyncEnd=function(){ n=Math.max(0,n-1); if(n===0){ if(dly){clearTimeout(dly);dly=null;} if(t)clearTimeout(t); t=setTimeout(hide,350); } };
  if(window.fetch && !window.fetch.__lmbWrap){
    var of=window.fetch.bind(window);
    var wf=function(input,init){
      var u=''; try{ u=(typeof input==='string')?input:((input&&input.url)||''); }catch(e){}
      var gas=/script\.google\.com|\/macros\/s\//.test(u) && !LMB_SILENT.test(u);
      if(gas) window.__lmbSyncStart();
      var p;
      try{ p=of(input,init); }catch(e){ if(gas) window.__lmbSyncEnd(); throw e; }
      if(gas){ try{ if(p&&p.then) p.then(function(){window.__lmbSyncEnd();},function(){window.__lmbSyncEnd();}); else window.__lmbSyncEnd(); }catch(e){ window.__lmbSyncEnd(); } }
      return p;
    };
    wf.__lmbWrap=true;
    window.fetch=wf;
  }
})();
</script>

</head>
<body>

<div class="login-box">
  <div class="logo-area">
    <div class="logo-mark"><span>L</span></div>
    <div class="title">SCLASS LAMBORGHINI</div>
    <div class="sub">INTEGRATED PORTAL</div>
  </div>

  <div class="sep"></div>

  <form id="login-form" onsubmit="doLogin(event)">
    <!-- メイン：LINEでログイン -->
    <button type="button" onclick="lineLogin()" style="width:100%;background:#06c755;color:#fff;border:none;border-radius:8px;padding:.85rem;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;display:flex;align-items:center;justify-content:center;gap:.4rem">
      <span style="font-weight:900">LINE</span> でログイン
    </button>
    <div class="err-msg" id="line-err"></div>

    <!-- 開発者用：メール＋パスワード（普段は隠す。押すと開く） -->
    <div style="text-align:center;margin-top:1.1rem">
      <button type="button" id="dev-toggle" onclick="toggleDevLogin()" style="background:none;border:none;color:#9a9a9a;font-size:.78rem;cursor:pointer;text-decoration:underline;font-family:'Noto Sans JP',sans-serif">開発者はこちら ▾</button>
    </div>
    <div id="dev-login" style="display:none;margin-top:.7rem">
      <div class="field">
        <label>メールアドレス</label>
        <input class="input" type="email" id="f-email" placeholder="name@sclass.jp" autocomplete="username">
      </div>
      <div class="field">
        <label>パスワード</label>
        <input class="input" type="password" id="f-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-login" type="submit">ログイン</button>
      <div class="err-msg" id="err"></div>
    </div>
  </form>

</div>

<!-- ═══ shared.js (最小版) ═══ -->
<script>
const S = {
  staff: JSON.parse(localStorage.getItem('lmb_staff') || '[]'),
};
window.S = S;

// パスワードのハッシュ化（簡易）
function hashPass(p){
  let h = 0;
  const s = 'lmb_salt_' + p;
  for (let i = 0; i < s.length; i++){
    h = ((h << 5) - h) + s.charCodeAt(i);
    h |= 0;
  }
  return 'h' + Math.abs(h).toString(36);
}
window.hashPass = hashPass;

// GAS現行URL（起動時に古い保存を自動上書き）
const GAS_URL = (function(){var U='https://script.google.com/macros/s/AKfycbwLHdGQrxsQzNK-hfRa7Gu_9t4Qz8IseeMHUTVeobiYuWRJ8Lpfku98vYYnN3TNx-4b/exec';try{if(localStorage.getItem('gasUrl')!==U)localStorage.setItem('gasUrl',U);}catch(e){}return U;})();
window.GAS_URL = GAS_URL;

// ─── 開発者ログイン（メール＋パスワード）の開閉 ─────
function toggleDevLogin(){
  var d = document.getElementById('dev-login');
  var t = document.getElementById('dev-toggle');
  if (!d) return;
  var open = (d.style.display === 'none' || d.style.display === '');
  d.style.display = open ? 'block' : 'none';
  if (t) t.textContent = open ? '開発者はこちら ▴' : '開発者はこちら ▾';
  if (open){ var e = document.getElementById('f-email'); if (e) e.focus(); }
}

// ─── LINEでログイン（LINE認証画面へ）─────
async function lineLogin(){
  const le = document.getElementById('line-err');
  if (le) le.textContent = 'LINEに移動しています…';
  try{
    const d = await fetch(GAS_URL + '?action=lineLoginUrl&_=' + Date.now(), { cache:'no-store' }).then(r=>r.json());
    if (d && d.ok && d.url){ location.href = d.url; return; }
    if (le) le.textContent = 'LINEログインを開始できませんでした';
  }catch(e){
    if (le) le.textContent = '通信エラー。時間をおいてお試しください';
  }
}

// ─── ログイン処理（サーバ認証：GASでパスワード検証→トークン取得）─────
async function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('f-email').value.trim().toLowerCase();
  const pass  = document.getElementById('f-pass').value;
  const err   = document.getElementById('err');
  err.textContent = '';
  const passHash = hashPass(pass);

  try {
    const r = await fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'login', email, passHash }) });
    const d = await r.json();
    if (d && d.ok && d.token){
      sessionStorage.setItem('lmb_token', d.token);                       // セッショントークン
      sessionStorage.setItem('lmb_current_user', JSON.stringify(d.user)); // 本人情報
      location.href = 'portal.html';
      return;
    }
    const msg = {
      not_found: 'メールアドレスが登録されていないか、無効化されています',
      inactive:  'このアカウントは無効化されています',
      bad_pass:  'パスワードが違います',
      missing:   'メールとパスワードを入力してください'
    }[d && d.error] || 'ログインに失敗しました';
    err.textContent = msg;
  } catch(netErr){
    // サーバに接続できない場合は「認証できない」＝ログインさせない。
    // ※以前はここでブラウザ内だけの判定にフォールバックしていたが、平文パスワードが
    //   HTMLに残り、通信を止めるだけでadminとして入れてしまうため廃止した。
    //   緊急時は GAS のスクリプトプロパティ EMERGENCY_PASSWORD で入れる（サーバ認証）。
    err.textContent = 'サーバに接続できません。ネットワークをご確認のうえ、もう一度お試しください';
  }
}

// ※ doLoginLocalFallback（GAS不通時のローカル判定）は廃止しました。
//    理由：平文パスワードがHTMLに残る／パスワード未設定のスタッフなら誰でも入れてしまう／
//    通信を止めるだけで認証を迂回できる、という3点。認証は必ずサーバ（GAS）で行います。


// スタッフが既に登録されている場合はdev-hintを隠す
window.addEventListener('DOMContentLoaded', () => {
  const staffList = JSON.parse(localStorage.getItem('lmb_staff') || '[]');
  if (staffList.length > 0){
    const hint = document.getElementById('dev-hint');
    if (hint) hint.style.display = 'none';
  }

  // 既にログイン中ならポータルへ
  const cur = sessionStorage.getItem('lmb_current_user');
  if (cur){
    // location.href = 'portal.html';  // 自動遷移は無効化（手動でログインし直せるように）
  }
});
</script>

</body>
</html>
