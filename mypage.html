<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>マイページ | LAMBORGHINI WINE</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{ --gold:#C9A84C; --gold-l:#E8CC7A; --bg:#0a0a0c; --card:#141418; --line:rgba(201,168,76,.18); --ivory:#e8e0cc; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;background:var(--bg);color:var(--ivory);min-height:100vh}
.header{background:linear-gradient(180deg,#16161a,#0a0a0c);border-bottom:1px solid var(--line);padding:18px 16px 14px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{font-size:1.05rem;letter-spacing:.35em;color:var(--gold-l);font-weight:700}
.header .sub{font-size:.6rem;letter-spacing:.3em;color:#8a8270;margin-top:2px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
.banner{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:.68rem;text-align:center;padding:6px;border-radius:6px;margin-bottom:10px}
.store{font-size:.95rem;font-weight:700;color:var(--gold-l);margin:6px 2px 10px}
.summary{display:flex;gap:10px;margin-bottom:14px}
.sumcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.sumcard .lbl{font-size:.62rem;color:#9a917c;letter-spacing:.1em}
.sumcard .val{font-size:1.25rem;font-weight:700;margin-top:4px}
.sumcard .val.red{color:#ff8a80}
.sumcard .val.gold{color:var(--gold-l)}
.sec-title{font-size:.72rem;color:var(--gold);letter-spacing:.15em;margin:16px 2px 8px}
.order{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.order .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.order .date{font-size:.7rem;color:#9a917c}
.badge{font-size:.62rem;padding:2px 10px;border-radius:99px;font-weight:700}
.badge.unpaid{background:rgba(255,99,99,.15);color:#ff8a80;border:1px solid rgba(255,99,99,.35)}
.badge.paid{background:rgba(80,200,120,.13);color:#7ee2a8;border:1px solid rgba(80,200,120,.35)}
.badge.other{background:rgba(201,168,76,.13);color:var(--gold-l);border:1px solid var(--line)}
.order .items{font-size:.8rem;line-height:1.6;margin-bottom:6px}
.order .bottom{display:flex;justify-content:space-between;align-items:flex-end}
.order .pay{font-size:.65rem;color:#9a917c}
.order .amt{font-size:1.05rem;font-weight:700;color:var(--gold-l)}
.empty,.errbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px 14px;text-align:center;font-size:.8rem;color:#9a917c;line-height:1.8}
.errbox{color:#ff8a80;border-color:rgba(255,99,99,.3)}
.loading{text-align:center;padding:40px;color:#9a917c;font-size:.8rem}
.spinner{width:28px;height:28px;border:3px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:.6rem;color:#6f6857;text-align:center;margin-top:18px;line-height:1.7}
.sponsor-box{background:var(--card);border:1px solid rgba(155,89,182,.3);border-radius:10px;padding:6px 12px;margin-bottom:6px}
.sp-row,.sp-log{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(201,168,76,.08);font-size:.8rem}
.sp-row:last-child,.sp-log:last-child{border-bottom:none}
.sp-q{font-weight:700;color:#c39bd3}
.sp-total-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0 4px;font-size:.82rem;font-weight:700;border-top:1px solid rgba(201,168,76,.18);margin-top:2px}
.sp-date{font-size:.7rem;color:#9a917c;min-width:74px}
.sp-prod{flex:1;text-align:left;padding:0 8px;font-size:.74rem}
.sp-badge{font-size:.66rem;padding:2px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
.sp-e{background:rgba(80,200,120,.13);color:#7ee2a8;border:1px solid rgba(80,200,120,.35)}
.sp-u{background:rgba(155,89,182,.15);color:#c39bd3;border:1px solid rgba(155,89,182,.35)}
.order-sp{margin:6px 0 2px;padding-top:6px;border-top:1px dashed rgba(155,89,182,.25)}
.order-sp-line{font-size:.78rem;color:#c39bd3;line-height:1.8}
.sp-free{font-size:.6rem;color:#c39bd3;border:1px solid rgba(155,89,182,.4);border-radius:99px;padding:1px 7px;margin-left:4px}
.order-sp-earned{font-size:.68rem;color:#7ee2a8;margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <h1>マイページ</h1>
  <div class="sub">LAMBORGHINI WINE</div>
</div>
<div class="wrap">
  <div id="content"><div class="loading"><div class="spinner"></div>読み込み中…</div></div>
  <div class="note">表示はご注文受付時点の情報です。<br>金額・入金状況のご不明点はSclassまでお問い合わせください。</div>
</div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzeHrI9eyBT2cDS2vuF8pjtlZ-mEPiTzlWqcuiVto8UsE-XJtccc304tIRcR__hhUvL/exec';
const LIFF_ID = '2009445526-zVg2JKdi';   // マイページ（LINE Developers発行）

const fmt = n => Number(n || 0).toLocaleString();

function badge(st){
  const s = String(st || '');
  if (s.startsWith('未')) return '<span class="badge unpaid">' + esc(s) + '</span>';
  if (s.includes('済')) return '<span class="badge paid">' + esc(s) + '</span>';
  return '<span class="badge other">' + esc(s || '—') + '</span>';
}
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function itemsText(raw){
  try {
    const o = typeof raw === 'string' ? JSON.parse(raw) : raw;
    return Object.entries(o).map(([k,v]) => esc(k) + ' × ' + esc(v) + '本').join('<br>');
  } catch(e){ return esc(raw || ''); }
}
function dateText(d){
  const s = String(d || '');
  const m = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  return m ? `${m[1]}/${m[2]}/${m[3]}` : s.slice(0,16);
}

async function init(){
  let uid = '';
  // LIFFでLINEプロフィール取得（失敗時はブラウザモード: ?uid=でテスト可）
  try {
    if (!LIFF_ID) throw new Error('LIFF_ID未設定');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const prof = await liff.getProfile();
    uid = prof.userId;
  } catch(e) {
    document.querySelector('.header').insertAdjacentHTML('afterend',
      '<div class="wrap" style="padding-bottom:0"><div class="banner">⚠ ブラウザモードで動作中（LINE連携なし）</div></div>');
    uid = new URLSearchParams(location.search).get('uid') || '';
  }
  const box = document.getElementById('content');
  if (!uid){
    box.innerHTML = '<div class="errbox">LINEアカウント情報を取得できませんでした。<br>LINEアプリ内から開いてください。</div>';
    return;
  }
  try {
    const r = await fetch(GAS_URL + '?action=getMyOrders&uid=' + encodeURIComponent(uid) + '&_=' + Date.now(), { cache: 'no-store' });
    const d = await r.json();
    if (!d.ok){
      box.innerHTML = d.error === 'unregistered'
        ? '<div class="errbox">このLINEアカウントはまだお客様登録がありません。<br>お手数ですがSclass担当者までご連絡ください。</div>'
        : '<div class="errbox">情報を取得できませんでした。時間をおいて再度お試しください。</div>';
      return;
    }
    render(box, d);
  } catch(e){
    box.innerHTML = '<div class="errbox">通信エラーが発生しました。<br>電波状況をご確認のうえ開き直してください。</div>';
  }
}

function render(box, d){
  const orders = d.orders || [];
  const sp = d.sponsor || { total:0, byProduct:{} };
  const spLogs = d.sponsorLogs || [];

  // 注文IDごとに協賛（使用/付与）をまとめる
  const spByOrder = {};
  spLogs.forEach(l => {
    const oid = String(l.orderId || '');
    if (!oid) return;
    if (!spByOrder[oid]) spByOrder[oid] = { used:[], earned:[] };
    if (String(l.type) === 'earned') spByOrder[oid].earned.push(l);
    else spByOrder[oid].used.push(l);
  });
  const orderIdSet = {};
  orders.forEach(o => { if (o.id) orderIdSet[String(o.id)] = 1; });

  let html = '';
  html += '<div class="store">' + esc(d.store) + ' 様</div>';
  html += '<div class="summary">';
  html += '<div class="sumcard"><div class="lbl">ご請求残高（未収）</div><div class="val ' + (d.unpaidTotal > 0 ? 'red' : 'gold') + '">¥' + fmt(d.unpaidTotal) + '</div></div>';
  html += '<div class="sumcard"><div class="lbl">ご注文件数</div><div class="val gold">' + orders.length + '件</div></div>';
  html += '</div>';

  // 協賛残数カード
  const spProds = Object.keys(sp.byProduct || {}).filter(p => (sp.byProduct[p] || 0) > 0);
  if (spProds.length){
    html += '<div class="sec-title">▸ 協賛残数</div>';
    html += '<div class="sponsor-box">';
    spProds.forEach(p => {
      html += '<div class="sp-row"><span>🎁 ' + esc(p) + '</span><span class="sp-q">' + (sp.byProduct[p] || 0) + '本</span></div>';
    });
    html += '<div class="sp-total-row"><span>合計</span><span class="sp-q">' + (sp.total || 0) + '本</span></div>';
    html += '</div>';
  }

  // ご注文履歴（各カードに協賛を差し込む）
  html += '<div class="sec-title">▸ ご注文履歴</div>';
  if (orders.length === 0){
    html += '<div class="empty">ご注文履歴はまだありません。</div>';
  } else {
    orders.forEach(o => {
      const spo = spByOrder[String(o.id)] || { used:[], earned:[] };
      html += '<div class="order">';
      html += '<div class="top"><span class="date">' + esc(dateText(o.date)) + (o.id ? '　No.' + esc(o.id) : '') + '</span>' + badge(o.payStatus) + '</div>';
      html += '<div class="items">' + itemsText(o.items) + '</div>';
      // 協賛（無料）分をこの注文に表示
      if (spo.used.length){
        html += '<div class="order-sp">';
        spo.used.forEach(l => {
          html += '<div class="order-sp-line">🎁 ' + esc(l.product || '') + ' × ' + (l.qty || 0) + '本 <span class="sp-free">協賛・無料</span></div>';
        });
        html += '</div>';
      }
      // 付与（この注文で貯まった協賛）
      if (spo.earned.length){
        const e = spo.earned.reduce((s,l) => s + (l.qty || 0), 0);
        if (e > 0) html += '<div class="order-sp-earned">🎁 この注文で協賛 +' + e + '本 付与</div>';
      }
      html += '<div class="bottom"><span class="pay">' + esc(o.payMethod || '') + (o.status ? '　／　' + esc(o.status) : '') + '</span><span class="amt">¥' + fmt(o.amount) + '</span></div>';
      html += '</div>';
    });
  }

  // 注文に紐づかない協賛（管理者調整など）は「その他の協賛履歴」に
  const orphan = spLogs.filter(l => { const oid = String(l.orderId || ''); return !oid || !orderIdSet[oid]; });
  if (orphan.length){
    html += '<div class="sec-title">▸ その他の協賛履歴</div>';
    html += '<div class="sponsor-box">';
    orphan.forEach(l => {
      const isE = String(l.type) === 'earned';
      html += '<div class="sp-log"><span class="sp-date">' + esc(dateText(l.date)) + '</span><span class="sp-prod">' + esc(l.product || '') + '</span><span class="sp-badge ' + (isE ? 'sp-e' : 'sp-u') + '">' + (isE ? '付与 +' : '使用 −') + (l.qty || 0) + '本</span></div>';
    });
    html += '</div>';
  }

  box.innerHTML = html;
}

init();
</script>
</body>
</html>
