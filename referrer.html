<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>紹介ダッシュボード | LAMBORGHINI WINE</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{ --gold:#C9A84C; --gold-l:#E8CC7A; --bg:#0a0a0c; --card:#141418; --line:rgba(201,168,76,.18); --ivory:#e8e0cc; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;background:var(--bg);color:var(--ivory);min-height:100vh}
.header{background:linear-gradient(180deg,#16161a,#0a0a0c);border-bottom:1px solid var(--line);padding:18px 16px 14px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{font-size:1.05rem;letter-spacing:.3em;color:var(--gold-l);font-weight:700}
.header .sub{font-size:.6rem;letter-spacing:.3em;color:#8a8270;margin-top:2px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
.banner{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:.68rem;text-align:center;padding:6px;border-radius:6px;margin-bottom:10px}
.hello{font-size:.95rem;font-weight:700;color:var(--gold-l);margin:6px 2px 4px}
.hello small{display:block;font-size:.64rem;color:#9a917c;font-weight:400;margin-top:3px;letter-spacing:.04em}
.summary{display:flex;gap:8px;margin:14px 0}
.sumcard{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center}
.sumcard .lbl{font-size:.6rem;color:#9a917c;letter-spacing:.05em}
.sumcard .val{font-size:1.15rem;font-weight:700;margin-top:4px}
.sumcard .val.gold{color:var(--gold-l)} .sumcard .val.green{color:#7ee2a8} .sumcard .val.amber{color:#ffcf7a}
.sec-title{font-size:.72rem;color:var(--gold);letter-spacing:.12em;margin:18px 2px 8px}
.cust{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.cust .top{display:flex;justify-content:space-between;align-items:center}
.cust .nm{font-size:.9rem;font-weight:700;color:var(--ivory)}
.cust .rw{font-size:1rem;font-weight:700;color:var(--gold-l)}
.cust .bt{display:flex;gap:12px;margin-top:5px;font-size:.66rem;color:#9a917c}
.cust .bt .g{color:#7ee2a8} .cust .bt .a{color:#ffcf7a}
.empty,.errbox,.loading{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 14px;text-align:center;font-size:.8rem;color:#9a917c;line-height:1.8}
.errbox{color:#ff8a80;border-color:rgba(255,99,99,.3)}
.spinner{width:28px;height:28px;border:3px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.refbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.refbox .qr{display:inline-block;background:#e8e0cc;padding:10px;border-radius:8px;margin:6px 0}
.refbox .lk{font-size:.66rem;color:#9a917c;word-break:break-all;background:#0e0e11;border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:8px}
.refbox button{margin-top:8px;background:var(--gold);color:#1a1200;border:none;padding:.5rem 1.1rem;border-radius:6px;font-size:.74rem;font-weight:700;cursor:pointer}
.note{font-size:.6rem;color:#6f6857;text-align:center;margin-top:18px;line-height:1.7}
</style>
</head>
<body>
<div class="header">
  <h1>紹介ダッシュボード</h1>
  <div class="sub">LAMBORGHINI WINE</div>
</div>
<div class="wrap">
  <div id="content"><div class="loading"><div class="spinner"></div>読み込み中…</div></div>
  <div class="note">報酬は当月末までに入金された分が「確定」となり、翌月10日にお支払いします。<br>表示は概算です。詳細はSclassまでお問い合わせください。</div>
</div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzeHrI9eyBT2cDS2vuF8pjtlZ-mEPiTzlWqcuiVto8UsE-XJtccc304tIRcR__hhUvL/exec';
const LIFF_ID = '';   // ★このページ用のLIFF IDを発行して貼り付け（空ならブラウザモード:?uid=でテスト）

const fmt = n => '¥' + Number(n||0).toLocaleString();
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init(){
  let uid = '';
  try {
    if (!LIFF_ID) throw new Error('LIFF_ID未設定');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const prof = await liff.getProfile();
    uid = prof.userId;
  } catch(e) {
    document.querySelector('.header').insertAdjacentHTML('afterend',
      '<div class="wrap" style="padding-bottom:0"><div class="banner">⚠ ブラウザモードで動作中（LINE連携なし）</div></div>');
    uid = new URLSearchParams(location.search).get('uid') || '';
  }
  const box = document.getElementById('content');
  if (!uid){ box.innerHTML = '<div class="errbox">LINEアカウント情報を取得できませんでした。<br>LINEアプリ内から開いてください。</div>'; return; }
  try {
    const r = await fetch(GAS_URL + '?action=getReferrerDashboard&uid=' + encodeURIComponent(uid) + '&_=' + Date.now(), { cache:'no-store' });
    const d = await r.json();
    render(box, d, uid);
  } catch(e){
    box.innerHTML = '<div class="errbox">通信エラーが発生しました。<br>電波状況をご確認のうえ開き直してください。</div>';
  }
}

function render(box, d, uid){
  if (!d || !d.ok){
    box.innerHTML = d && d.error === 'not_referrer'
      ? '<div class="errbox">紹介者として登録が見つかりませんでした。<br>Sclass担当者までご連絡ください。</div>'
      : '<div class="errbox">情報を取得できませんでした。時間をおいて再度お試しください。</div>';
    return;
  }
  const ref = d.referrer || {};
  const calc = ref.calcType === 'B' ? ('B方式：掛率差 ' + ref.calcParam + '掛') : ('A方式：売値 ' + ref.calcParam + '%');

  let html = '';
  html += '<div class="hello">' + esc(ref.name || '紹介者') + ' 様<small>紹介報酬の計算方式 ' + esc(calc) + '</small></div>';

  html += '<div class="summary">';
  html += '<div class="sumcard"><div class="lbl">報酬合計</div><div class="val gold">' + fmt(d.total) + '</div></div>';
  html += '<div class="sumcard"><div class="lbl">確定（支払対象）</div><div class="val green">' + fmt(d.confirmed) + '</div></div>';
  html += '<div class="sumcard"><div class="lbl">保留（未入金）</div><div class="val amber">' + fmt(d.pending) + '</div></div>';
  html += '</div>';

  html += '<div class="sec-title">▸ 紹介先（' + (d.custCount || 0) + '件）</div>';
  const list = d.list || [];
  if (!list.length){
    html += '<div class="empty">紹介先の顧客がまだ登録されていません。</div>';
  } else {
    list.forEach(c => {
      html += '<div class="cust"><div class="top"><span class="nm">' + esc(c.store) + '</span><span class="rw">' + fmt(c.reward) + '</span></div>'
            + '<div class="bt"><span class="g">確定 ' + fmt(c.confirmed) + '</span><span class="a">保留 ' + fmt(c.pending) + '</span><span>注文 ' + (c.orders||0) + '件</span></div></div>';
    });
  }

  html += '<div class="sec-title">▸ 紹介用リンク・QR</div>';
  html += '<div class="refbox">';
  html += '<div>お客様にこのリンク／QRを共有してください</div>';
  html += '<div class="qr" id="qr"></div>';
  html += '<div class="lk" id="reflink"></div>';
  html += '<button onclick="copyRef()">リンクをコピー</button>';
  html += '</div>';

  box.innerHTML = html;

  // 紹介リンク（このページと同じ場所の order.html に ?ref= を付与）
  const link = new URL('order.html?ref=' + encodeURIComponent(ref.id || ''), location.href).href;
  window._refLink = link;
  document.getElementById('reflink').textContent = link;
  try { new QRCode(document.getElementById('qr'), { text: link, width:160, height:160, colorDark:'#0a0a0c', colorLight:'#e8e0cc', correctLevel: QRCode.CorrectLevel.M }); }
  catch(e){ document.getElementById('qr').textContent = 'QR生成不可'; }
}

function copyRef(){
  const t = window._refLink || '';
  if (!t) return;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(()=>alert('リンクをコピーしました'), ()=>prompt('コピーしてください', t));
  else prompt('コピーしてください', t);
}

init();
</script>
</body>
</html>
