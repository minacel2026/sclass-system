<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sclass | LAMBORGHINI WINE</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{ --gold:#C9A84C; --gold-l:#E8CC7A; --bg:#0a0a0c; --card:#141418; --line:rgba(201,168,76,.18); --ivory:#e8e0cc; }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;background:var(--bg);color:var(--ivory);min-height:100vh}
.header{background:linear-gradient(180deg,#16161a,#0a0a0c);border-bottom:1px solid var(--line);padding:18px 16px 14px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{font-size:1.05rem;letter-spacing:.35em;color:var(--gold-l);font-weight:700}
.header .sub{font-size:.6rem;letter-spacing:.3em;color:#8a8270;margin-top:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 60px}
.banner{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:.68rem;text-align:center;padding:6px;border-radius:6px;margin-bottom:12px}
.hello{font-size:.95rem;color:var(--gold-l);font-weight:700;margin:6px 2px 16px}
.hello small{display:block;font-size:.66rem;color:#9a917c;font-weight:400;margin-top:3px;letter-spacing:.05em}
.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px;margin-bottom:12px;cursor:pointer;text-decoration:none;color:inherit;transition:all .15s}
.card:active{background:#1c1c20;border-color:rgba(201,168,76,.4)}
.card .ic{font-size:1.7rem;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:rgba(201,168,76,.1);border:1px solid var(--line);border-radius:10px;flex-shrink:0}
.card .tx{flex:1}
.card .tx .t{font-size:.95rem;font-weight:700;color:var(--gold-l)}
.card .tx .d{font-size:.68rem;color:#9a917c;margin-top:3px;line-height:1.5}
.card .arw{color:var(--gold);font-size:1.1rem}
.empty,.errbox,.loading{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:30px 16px;text-align:center;font-size:.82rem;color:#9a917c;line-height:1.9}
.errbox{color:#ff8a80;border-color:rgba(255,99,99,.3)}
.spinner{width:28px;height:28px;border:3px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:.6rem;color:#6f6857;text-align:center;margin-top:20px;line-height:1.7}
</style>
</head>
<body>
<div class="header">
  <h1>SCLASS</h1>
  <div class="sub">LAMBORGHINI WINE</div>
</div>
<div class="wrap">
  <div id="content"><div class="loading"><div class="spinner"></div>読み込み中…</div></div>
  <div class="note">ご不明点はSclassまでお問い合わせください。</div>
</div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzeHrI9eyBT2cDS2vuF8pjtlZ-mEPiTzlWqcuiVto8UsE-XJtccc304tIRcR__hhUvL/exec';
const LIFF_ID = '';   // ★このページ用のLIFF IDを LINE Developers で発行して貼り付け（空ならブラウザモード:?uid=でテスト）

function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init(){
  let uid = '';
  try {
    if (!LIFF_ID) throw new Error('LIFF_ID未設定');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const prof = await liff.getProfile();
    uid = prof.userId;
  } catch(e) {
    document.querySelector('.header').insertAdjacentHTML('afterend',
      '<div class="wrap" style="padding-bottom:0"><div class="banner">⚠ ブラウザモードで動作中（LINE連携なし）</div></div>');
    uid = new URLSearchParams(location.search).get('uid') || '';
  }
  const box = document.getElementById('content');
  if (!uid){
    box.innerHTML = '<div class="errbox">LINEアカウント情報を取得できませんでした。<br>LINEアプリ内から開いてください。</div>';
    return;
  }
  try {
    const r = await fetch(GAS_URL + '?action=getRole&uid=' + encodeURIComponent(uid) + '&_=' + Date.now(), { cache:'no-store' });
    const d = await r.json();
    render(box, d, uid);
  } catch(e){
    box.innerHTML = '<div class="errbox">通信エラーが発生しました。<br>電波状況をご確認のうえ開き直してください。</div>';
  }
}

function render(box, d, uid){
  if (!d || !d.ok){
    box.innerHTML = '<div class="errbox">情報を取得できませんでした。時間をおいて再度お試しください。</div>';
    return;
  }
  const q = '?uid=' + encodeURIComponent(uid);
  // 実ページがある役割（=遷移可能）
  const cards = [];
  if (d.isStaff){
    cards.push({ ic:'📝', t:'注文入力', d:'お客様の注文を登録', href:'order.html' + q });
  }
  if (d.isCustomer){
    const store = (d.customer && d.customer.store) ? d.customer.store + ' 様' : 'マイページ';
    cards.push({ ic:'👤', t:'マイページ', d:store + '｜注文履歴・ご請求・協賛', href:'mypage.html' + q });
  }
  // 紹介者ダッシュボードは準備中（次回更新で公開）。404防止のためリンクにしない
  const refName = d.isReferrer ? ((d.referrer && d.referrer.name) ? d.referrer.name + ' 様' : '紹介者') : '';
  const refPanel = d.isReferrer
    ? '<div class="card" style="cursor:default;border-style:dashed">'
      + '<div class="ic">🤝</div>'
      + '<div class="tx"><div class="t">紹介ダッシュボード <span style="font-size:.6rem;color:#9a917c">準備中</span></div>'
      + '<div class="d">' + esc(refName) + '｜紹介先・報酬・紹介リンクを近日公開</div></div></div>'
    : '';

  if (cards.length === 0 && !d.isReferrer){
    box.innerHTML = '<div class="errbox">このLINEアカウントは未登録です。<br>お手数ですがSclass担当者までご連絡ください。</div>';
    return;
  }

  // 遷移できる画面がちょうど1つ かつ 紹介者でない → 自動で開く（＝アカウントで自動切替）
  if (cards.length === 1 && !d.isReferrer){
    location.replace(cards[0].href);
    return;
  }

  // 複数 or 紹介者あり → カードで選択
  let html = '<div class="hello">ようこそ<small>ご利用になる画面をお選びください</small></div>';
  cards.forEach(c => {
    html += '<a class="card" href="' + c.href + '">'
          + '<div class="ic">' + c.ic + '</div>'
          + '<div class="tx"><div class="t">' + esc(c.t) + '</div><div class="d">' + esc(c.d) + '</div></div>'
          + '<div class="arw">›</div></a>';
  });
  html += refPanel;
  box.innerHTML = html;
}

init();
</script>
</body>
</html>
